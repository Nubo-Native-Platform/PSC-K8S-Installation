# =============================================================================
#  inventory.conf — describe your cluster here, then run:  ./deploy.sh
#  The deployer SSHes to every node for you (no manual ssh needed).
# =============================================================================

[settings]
# --- Kubernetes ---
K8S_MINOR=latest               # "latest" = newest stable (auto-detected); or pin e.g. 1.37
K8S_PATCH=                     # empty = latest patch (or pin e.g. 1.37.0)
CNI=flannel                    # flannel | calico

# --- HA is AUTO-DETECTED from the number of [masters] below ---
#   1 master  -> single control plane
#   2+ masters -> HA (multi). Then set CONTROL_PLANE_ENDPOINT to a VIP/LB
#                 that fronts all masters (keepalived VIP or an L4 LB).
#                 A quick option: scripts/lb-haproxy-setup.sh on a spare host.
CONTROL_PLANE_ENDPOINT=        # e.g. 10.0.0.10:6443   (required only for HA)

POD_CIDR=10.244.0.0/16

# --- Storage: pick ONE backend ---
#   longhorn -> distributed replicated block storage on the nodes
#   nfs      -> dynamic PVCs from an EXTERNAL NFS server (set NFS_* below;
#               prepare it with scripts/nfs-server-setup.sh)
#   none     -> skip storage
STORAGE=longhorn
# NFS options (only when STORAGE=nfs):
# NFS_SERVER=10.0.0.30
# NFS_PATH=/srv/nfs/k8s
# NFS_SC_NAME=nfs-client

# --- SSH (used to reach every node) ---
SSH_USER=ubuntu                # login user on the nodes (must have sudo)
SSH_KEY=~/.ssh/id_rsa          # private key; leave blank to use ssh-agent/password
SSH_PORT=22

# =============================================================================
#  Nodes:  <name>  <ip-or-host>   (name is just a label for logs)
#  First master listed becomes the primary that runs `kubeadm init`.
# =============================================================================

[masters]
master1  10.0.0.11
# master2  10.0.0.12
# master3  10.0.0.13

[workers]
worker1  10.0.0.21
worker2  10.0.0.22
# worker3  10.0.0.23
