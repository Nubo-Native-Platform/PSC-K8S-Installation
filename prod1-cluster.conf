# =============================================================================
#  prod1-cluster.conf — 3 masters + 5 workers, NFS storage (test topology)
#
#  Deploy with:   ./deploy.sh -i prod1-cluster.conf check
#                 ./deploy.sh -i prod1-cluster.conf
#
#  ONE-SHOT: with LB_HOST and NFS_SETUP set below, a single command builds
#  everything — HAProxy on the proxy, NFS on the file server, then the cluster:
#         ./deploy.sh -i prod1-cluster.conf check   # verify SSH+sudo first
#         ./deploy.sh -i prod1-cluster.conf         # provision LB+NFS + build
#
#  SSH ACCESS — pick ONE:
#   a) set up keys yourself once:
#         ssh-copy-id ubuntu@192.168.18.61   ... through .68 and .69
#         ssh-copy-id debian@192.168.18.51   # proxy (Debian, different user)
#   b) let deploy.sh bootstrap it: add a password as the 3rd column on each node
#      line below, and LB_PASSWORD / NFS_PASSWORD in [settings]. deploy.sh then
#      installs your key + passwordless sudo automatically (needs sshpass on
#      Linux/mac/WSL, or PuTTY plink on Windows).
#
#  SECURITY: if you add passwords, DO NOT commit this file. Copy it to
#  prod1-cluster.local.conf (git-ignored) and run:  ./deploy.sh -i prod1-cluster.local.conf
# =============================================================================

[settings]
# --- Kubernetes ---
K8S_MINOR=latest               # newest stable (auto-detected); pin e.g. 1.37 to freeze
K8S_PATCH=                      # empty = latest patch on the minor
CNI=flannel                    # flannel | calico

# --- HA: 3 masters => multi. HAProxy is auto-provisioned on the proxy server
#     below (LB_HOST), and the endpoint is derived as LB_HOST:6443. You can also
#     set CONTROL_PLANE_ENDPOINT explicitly to override.
LB_HOST=192.168.18.51          # proxy host to run HAProxy on
LB_SSH_USER=debian             # proxy logs in as 'debian', not 'ubuntu'
# CONTROL_PLANE_ENDPOINT=192.168.18.51:6443   # optional explicit override

POD_CIDR=10.244.0.0/16
MAX_PODS=250                   # 250 pods/node (fits a /24 podCIDR); inotify uses high defaults

# --- Storage: NFS (Longhorn NOT used in this test) ---
STORAGE=nfs
NFS_SERVER=192.168.18.69
NFS_PATH=/srv/nfs/k8s
NFS_SC_NAME=nfs-client
NFS_SETUP=true                 # deploy.sh sets up the NFS server automatically
NFS_CIDR=192.168.18.0/24       # network allowed to mount the export

# --- After install, copy the admin kubeconfig to ./kubeconfig on this machine? ---
FETCH_KUBECONFIG=true          # true | false

# --- SSH (used to reach every node) ---
SSH_USER=ubuntu                # must have passwordless sudo on every node
SSH_KEY=~/.ssh/id_rsa          # private key; run ssh-copy-id to each node first
SSH_PORT=22

# Node lines:  <name>  <ip>  [password]
# The optional 3rd column (password) is ONLY for bootstrap (see SSH ACCESS note).
# Leave it off if you already set up SSH keys. Never commit real passwords.
[masters]
master1  192.168.18.61
master2  192.168.18.62
master3  192.168.18.63

[workers]
worker1  192.168.18.64
worker2  192.168.18.65
worker3  192.168.18.66
worker4  192.168.18.67
worker5  192.168.18.68
